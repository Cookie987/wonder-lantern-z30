[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "wonder-lantern-z30"
version = "0.1.0.dev0"
description = "Experimental modular firmware host and extensions for Nikon Z30 C 1.20"
requires-python = ">=3.10"

[project.scripts]
wonder-lantern-z30 = "z30_extensions.cli:main"

[project.optional-dependencies]
sound = ["keystone-engine==0.9.2"]
verify = ["unicorn==2.1.4"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"z30_extensions.platform" = ["z30_120_zero_samples.json"]
